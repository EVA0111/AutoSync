name: Build one-click AutoSync v1.2 patcher

on:
  push:
    branches:
      - feature/one-click-v12-patcher
      - main
    paths:
      - 'tools/AutoSyncV12Patcher/**'
      - '.github/workflows/build-v12-patcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-patcher:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone self-contained Windows patcher
        shell: pwsh
        run: |
          dotnet publish tools/AutoSyncV12Patcher/AutoSyncV12Patcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/patcher
          if ($LASTEXITCODE -ne 0) { throw 'Patcher compilation failed.' }
      - name: Run patcher self-test
        shell: pwsh
        run: |
          & 'out/patcher/AutoSync-v1.2-PreviewEdit-Patcher.exe' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Patcher self-test failed.' }
      - name: Make patcher download ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'out/release' -Force | Out-Null
          Copy-Item 'out/patcher/AutoSync-v1.2-PreviewEdit-Patcher.exe' 'out/release/'
          Copy-Item 'tools/AutoSyncV12Patcher/README.md' 'out/release/README.md'
          Compress-Archive -Path 'out/release/*' -DestinationPath 'AutoSync-v1.2-PreviewEdit-Patcher.zip' -CompressionLevel Optimal -Force
          Get-FileHash 'AutoSync-v1.2-PreviewEdit-Patcher.zip' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSync-v1.2-PreviewEdit-Patcher
          path: AutoSync-v1.2-PreviewEdit-Patcher.zip
          if-no-files-found: error
      - name: Publish patcher release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.2-preview-edit-patcher'
          $zip = 'AutoSync-v1.2-PreviewEdit-Patcher.zip'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'AutoSync v1.2 Preview & Edit one-click patcher' --notes 'One-click patcher for an extracted AutoSync v1.2 Windows portable installation. Makes a separate output folder and portable ZIP. Does NOT upgrade the v1.2 matching algorithm to v1.3; real-media testing remains required.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish patcher ZIP.' }
