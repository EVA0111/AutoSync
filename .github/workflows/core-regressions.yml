name: AutoSync core regression tests

on:
  push:
    paths:
      - 'AutoSync/**'
      - '.github/workflows/core-regressions.yml'
  pull_request:
    paths:
      - 'AutoSync/**'
      - '.github/workflows/core-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AutoSync/requirements.txt
      - name: Install Python dependencies and FFmpeg
        # FFmpeg 9.0, as bundled in the portable app. Ubuntu's own FFmpeg (6.1)
        # decodes audio with gaps in its timestamps differently: the audio after
        # a gap lands early (test_audio_gaps), so it does not test what ships.
        run: |
          python -m pip install --disable-pip-version-check -r AutoSync/requirements.txt
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin" >> "$GITHUB_PATH"
      - name: Show FFmpeg version
        run: ffmpeg -version | head -1
      - name: Run all repository unit and synthetic regressions
        working-directory: AutoSync
        run: python -m unittest discover -s . -p 'test_*.py' -v

  windows-python-regressions:
    # Windows defaults to a legacy code page; catch implicit-encoding bugs.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies and FFmpeg
        run: |
          python -m pip install --disable-pip-version-check -r AutoSync/requirements.txt
          choco install ffmpeg -y --no-progress
      - name: Run all repository unit and synthetic regressions
        working-directory: AutoSync
        run: python -m unittest discover -s . -p "test_*.py" -v

  desktop-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run desktop tests
        working-directory: AutoSync
        run: npm run test:editor

  windows-desktop-regressions:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Windows desktop regression tests
        working-directory: AutoSync
        run: npm run test:editor

# Note: private six-case media and Zorro source/target files are NOT committed
# to this repository. These CI checks are unit/synthetic tests, not full media
# export or audio-quality verification.
