name: Build AutoSync from source (Windows x64)

on:
  push:
    branches:
      - main
    paths:
      - 'AutoSync/**'
      - 'build/windows/**'
      - '.github/workflows/build-windows-portable.yml'
  pull_request:
    paths:
      - 'AutoSync/**'
      - 'build/windows/**'
      - '.github/workflows/build-windows-portable.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the GitHub release after a successful build'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for the source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 for the source build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build using the documented source builder and run regressions
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'build/windows/build-portable.ps1' -OutputDirectory (Join-Path $PWD 'dist')
          if ($LASTEXITCODE -ne 0) { throw 'Source build or tests failed.' }

      - name: Upload finished portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoSync-v1.4.3-Windows-Portable
          path: dist/AutoSync-v1.4.3-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    # Releases are published only on request: Actions -> Run workflow on main with "publish" ticked.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AutoSync-v1.4.3-Windows-Portable
          path: release-assets
      - name: Publish v1.4.3 Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s release-assets/AutoSync-v1.4.3-Windows-Portable.zip
          if gh release view v1.4.3 >/dev/null 2>&1; then echo 'v1.4.3 already published'; exit 0; fi
          gh release create v1.4.3 release-assets/AutoSync-v1.4.3-Windows-Portable.zip --title 'AutoSync v1.4.3' --notes-file AutoSync/RELEASE_NOTES.md --target "$GITHUB_SHA" --latest
