name: Build AutoSync from source (Windows x64)

on:
  push:
    branches:
      - main
    paths:
      - 'AutoSync/**'
      - 'build/windows/**'
      - '.github/workflows/build-windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for the source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 for the source build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build using the documented source builder and run regressions
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'build/windows/build-portable.ps1' -OutputDirectory (Join-Path $PWD 'dist')
          if ($LASTEXITCODE -ne 0) { throw 'Source build or tests failed.' }

      - name: Upload finished portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoSync-Source-Windows-Portable
          path: dist/AutoSync-Source-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30

