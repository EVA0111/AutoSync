name: Build AutoSync from source (Windows x64)

on:
  push:
    branches:
      - main
    paths:
      - 'AutoSync/**'
      - 'build/windows/**'
      - '.github/workflows/build-windows-portable.yml'
  pull_request:
    paths:
      - 'AutoSync/**'
      - 'build/windows/**'
      - '.github/workflows/build-windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for the source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 for the source build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build using the documented source builder and run regressions
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'build/windows/build-portable.ps1' -OutputDirectory (Join-Path $PWD 'dist')
          if ($LASTEXITCODE -ne 0) { throw 'Source build or tests failed.' }

      - name: Upload finished portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoSync-v1.2.0-Windows-Portable
          path: dist/AutoSync-v1.2.0-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30


      - name: Publish AutoSync v1.2.0 GitHub Release (approved version commit only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Release AutoSync v1.2.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.2.0'
          $zip = 'dist/AutoSync-v1.2.0-Windows-Portable.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Release cancelled: portable ZIP was not created.' }
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'AutoSync v1.2.0' --notes-file AutoSync/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the v1.2.0 release.' }
          Write-Host 'AutoSync v1.2.0 release published with the tested portable ZIP.'
