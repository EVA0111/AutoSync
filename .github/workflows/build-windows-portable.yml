name: Build AutoSync Preview & Edit portable (Windows)

on:
  push:
    branches:
      - feature/windows-portable-preview-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Python regression tests
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AutoSync/requirements.txt
          python -m unittest discover -s AutoSync -p 'test_*.py' -v

      - name: Run editor regression tests
        shell: pwsh
        working-directory: AutoSync
        run: |
          npm install --no-audit --no-fund
          npm run test:editor

      - name: Package Electron for Windows x64
        shell: pwsh
        working-directory: AutoSync
        run: |
          npx --yes @electron/packager . AutoSync --platform=win32 --arch=x64 --out=../dist --overwrite --asar

      - name: Bundle Python 3.12, numerical dependencies, and FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resources = Join-Path $PWD 'dist/AutoSync-win32-x64/resources'
          $engine = Join-Path $resources 'engine'
          $pythonRoot = Join-Path $resources 'python'
          New-Item -ItemType Directory -Force -Path $engine, $pythonRoot | Out-Null
          Copy-Item 'AutoSync/*.py' -Destination $engine -Force
          Copy-Item 'AutoSync/requirements.txt' -Destination $engine -Force
          Copy-Item 'AutoSync/jobs_example.csv' -Destination $engine -Force
          Copy-Item 'AutoSync/README.md' -Destination $engine -Force

          $pythonZip = Join-Path $env:RUNNER_TEMP 'python-3.12-embed-amd64.zip'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $pythonZip
          Expand-Archive -Path $pythonZip -DestinationPath $pythonRoot -Force
          $pth = Join-Path $pythonRoot 'python312._pth'
          @('python312.zip', '.', 'Lib\site-packages', 'import site') | Set-Content -Path $pth -Encoding ascii
          $sitePackages = Join-Path $pythonRoot 'Lib/site-packages'
          New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
          python -m pip install --no-compile --only-binary=:all: --target $sitePackages -r AutoSync/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Bundled numerical dependencies failed to install.' }
          & (Join-Path $pythonRoot 'python.exe') -c 'import numpy, scipy; print("Bundled Python OK:", numpy.__version__, scipy.__version__)'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python import smoke test failed.' }

          $ffmpegZip = Join-Path $env:RUNNER_TEMP 'ffmpeg-essentials.zip'
          $ffmpegUnpacked = Join-Path $env:RUNNER_TEMP 'autosync-ffmpeg'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegUnpacked -Force
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            $found = Get-ChildItem -Path $ffmpegUnpacked -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $found) { throw "Missing $name from FFmpeg archive." }
            Copy-Item $found.FullName -Destination (Join-Path $engine $name) -Force
          }
          & (Join-Path $engine 'ffmpeg.exe') -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg smoke test failed.' }
          & (Join-Path $pythonRoot 'python.exe') (Join-Path $engine 'autosync.py') --help
          if ($LASTEXITCODE -ne 0) { throw 'Bundled engine smoke test failed.' }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/AutoSync-win32-x64' -DestinationPath 'AutoSync-PreviewEdit-Windows-Portable.zip' -CompressionLevel Optimal -Force
          Get-FileHash 'AutoSync-PreviewEdit-Windows-Portable.zip' -Algorithm SHA256 | Format-List

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: AutoSync-PreviewEdit-Windows-Portable
          path: AutoSync-PreviewEdit-Windows-Portable.zip
          retention-days: 30
          if-no-files-found: error
