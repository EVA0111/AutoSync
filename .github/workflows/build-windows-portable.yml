name: Build AutoSync from source (Windows x64)

on:
  push:
    branches:
      - main
      - refactor/source-build-opening-guard-ui
    paths:
      - 'AutoSync/**'
      - 'build/windows/**'
      - '.github/workflows/build-windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 for the source build
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22 for the source build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build using the documented source builder and run regressions
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'build/windows/build-portable.ps1' -OutputDirectory (Join-Path $PWD 'dist')
          if ($LASTEXITCODE -ne 0) { throw 'Source build or tests failed.' }

      - name: Upload finished portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoSync-Source-Windows-Portable
          path: dist/AutoSync-Source-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish source-build preview release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'source-build-20261030'
          $zip = 'dist/AutoSync-Source-Windows-Portable.zip'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'AutoSync source-build portable preview (Windows)' --notes 'Built directly from public repository source; self-contained Electron, Python 3.12, FFmpeg, NumPy and SciPy. Includes audio-based opening cut guard and GUI review controls. This is NOT a verified import of the separately uploaded v1.3 source. Unit tests passed in Windows CI; private seven-case media tests were not run.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
