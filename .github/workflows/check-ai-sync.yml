name: AI Sync model compatibility
on:
  pull_request:
    paths:
      - 'AutoSync/ai_sync.py'
      - 'AutoSync/requirements-sync-ai.txt'
      - 'AutoSync/smoke_ai_models.py'
      - '.github/workflows/check-ai-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch and optional model dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pillow>=10,<12' 'transformers>=4.48,<5'
      - name: Run real AST and DINOv2 model inference on generated media
        working-directory: AutoSync
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python smoke_ai_models.py
