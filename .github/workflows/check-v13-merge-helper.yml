name: Validate AutoSync v1.3 portable merge helper

on:
  push:
    branches:
      - feature/v13-engine-preserving-merge
    paths:
      - 'tools/Make-AutoSync-v1.3-PreviewEdit.ps1'
      - 'tools/Make-AutoSync-v1.3-PreviewEdit.cmd'
      - '.github/workflows/check-v13-merge-helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell helper
        shell: pwsh
        run: |
          $file = Join-Path $PWD 'tools/Make-AutoSync-v1.3-PreviewEdit.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'PowerShell parser found errors.'
          }
          Write-Host 'PowerShell source parsed successfully.'
      - name: Confirm helper never deletes the original installation
        shell: pwsh
        run: |
          $contents = Get-Content 'tools/Make-AutoSync-v1.3-PreviewEdit.ps1' -Raw
          if ($contents -notmatch 'Get-FileHash') { throw 'Expected SHA256 preservation checks are absent.' }
          if ($contents -notmatch 'Destination already exists') { throw 'Missing output overwrite protection.' }
          Write-Host 'Guard checks found.'
